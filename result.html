<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外省血統結果</title>
<style>
  :root {
    --bg: #f6f3ee; --card: #fff; --ink: #2b2b2b; --muted: #777;
    --line: #e2ddd5; --accent: #b5452f; --accent-soft: #f3ddd7; --partner: #2f6f8f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }

  .hero { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .hero img { display: block; width: 100%; height: auto; max-height: 560px; object-fit: cover; object-position: top; }
  .hero .body { padding: 20px 16px 24px; text-align: center; }
  .caption { margin: 0 0 8px; font-size: 1.6rem; font-weight: 800; line-height: 1.3; }
  .label { color: var(--muted); }
  .score { font-size: 3.6rem; font-weight: 800; color: var(--accent); line-height: 1.1; margin: 4px 0 12px; }
  .bar { height: 14px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }

  h2 { font-size: 1.05rem; margin: 28px 0 10px; }
  .calc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .calc h3 { margin: 0 0 8px; font-size: .95rem; }
  .calc h3 span { float: right; color: var(--accent); }
  .calc.partner h3 span { color: var(--partner); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { padding: 2px 10px; border-radius: 999px; font-size: .85rem; border: 1px solid var(--line); color: var(--muted); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .calc.partner .chip.on { background: var(--partner); border-color: var(--partner); }
  .formula { font-size: .9rem; color: var(--muted); margin: 2px 0; }
  .calc.kid { border-color: var(--accent); }

  .back {
    display: block; text-align: center; margin-top: 24px; padding: 12px;
    border-radius: 12px; border: 1px solid var(--accent); color: var(--accent);
    text-decoration: none; font-weight: 700;
  }
  .note { margin-top: 24px; font-size: .82rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <section class="hero">
    <img id="pic" alt="">
    <div class="body">
      <p class="caption" id="caption"></p>
      <div class="label" id="label"></div>
      <div class="score" id="score"></div>
      <div class="bar"><div id="fill"></div></div>
    </div>
  </section>

  <h2>計算公式</h2>
  <div id="calcs"></div>

  <a class="back" href="index.html">← 重新計算</a>

  <p class="note">※ 本計算器僅為趣味用途。「外省人」是歷史與身分認同的概念，不是生物學上的血統，結果不代表任何人的認同或價值。</p>
</main>

<script>
  const q = new URLSearchParams(location.search);
  const ok = s => /^[01]{4}$/.test(s || '');
  const f = q.get('f'), p = q.get('p');
  if (!ok(f) || (p !== null && !ok(p))) location.replace('index.html');

  const NAMES = ['爺爺', '奶奶', '外公', '外婆'];
  const pct = n => Number(n.toFixed(2)) + '%';
  const parse = s => s.split('').map(b => b === '1');

  // 每位祖父母 25%；爸爸 = 爺爺奶奶平均，媽媽 = 外公外婆平均
  function calc(flags) {
    const g = flags.map(b => b ? 25 : 0);
    const dad = (flags[0] + flags[1]) * 50;   // 爸爸本身的外省比例
    const mom = (flags[2] + flags[3]) * 50;
    return { flags, g, dad, mom, total: g.reduce((a, b) => a + b, 0) };
  }

  function card(title, r, cls) {
    const chips = NAMES.map((n, i) =>
      `<span class="chip${r.flags[i] ? ' on' : ''}">${n}${r.flags[i] ? '・外省' : ''}</span>`).join('');
    const line1 = NAMES.map((n, i) => `${n} ${r.g[i]}%`).join(' + ') + ` = ${pct(r.total)}`;
    const line2 = `也就是：(爸爸 ${pct(r.dad)} + 媽媽 ${pct(r.mom)}) ÷ 2 = ${pct(r.total)}`;
    return `<div class="calc ${cls}"><h3>${title}<span>${pct(r.total)}</span></h3>
      <div class="chips">${chips}</div>
      <p class="formula">${line1}</p><p class="formula">${line2}</p></div>`;
  }

  const me = calc(parse(f));
  let final = me.total, who = '你', html = card('你', me, '');

  if (p !== null) {
    const partner = calc(parse(p));
    final = (me.total + partner.total) / 2;
    who = '你的孩子';
    html += card('伴侶', partner, 'partner');
    html += `<div class="calc kid"><h3>孩子<span>${pct(final)}</span></h3>
      <p class="formula">(你 ${pct(me.total)} + 伴侶 ${pct(partner.total)}) ÷ 2 = ${pct(final)}</p></div>`;
  }

  const pic = document.getElementById('pic');
  if (final > 0) {
    pic.src = 'images/shocked.jpg';
    pic.alt = '震驚的表情';
    document.getElementById('caption').textContent = `什麼！ ${who}比羅大佑還純`;
  } else {
    pic.src = 'images/smirk.webp';
    pic.alt = '邪笑的表情';
    document.getElementById('caption').textContent = `嘿嘿嘿，${who}跟羅大佑一樣純`;
  }

  document.getElementById('label').textContent = who + '的外省血統';
  document.getElementById('score').textContent = pct(final);
  document.getElementById('fill').style.width = final + '%';
  document.getElementById('calcs').innerHTML = html;
</script>
</body>
</html>
